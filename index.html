<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عملیات پهپادی - حمله شهری</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            touch-action: none;
        }

        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #gameContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* کنترل‌ها */
        #controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 1000;
            pointer-events: none;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            pointer-events: auto;
        }

        .joystick-container {
            width: 140px;
            height: 140px;
            position: relative;
        }

        .joystick-base {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.3) 0%, rgba(0, 212, 255, 0.1) 70%);
            border: 3px solid rgba(0, 212, 255, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.4),
                        inset 0 0 20px rgba(0, 212, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .joystick-handle {
            position: absolute;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle at 30% 30%, #00d4ff, #0077ff);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.8),
                        0 5px 15px rgba(0, 0, 0, 0.3);
            cursor: move;
            border: 2px solid rgba(255, 255, 255, 0.8);
        }

        .action-button {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 0 25px currentColor;
            border: 3px solid rgba(255, 255, 255, 0.8);
        }

        .action-button:active {
            transform: scale(0.92);
            box-shadow: 0 0 35px currentColor;
        }

        #fireButton {
            background: radial-gradient(circle at 30% 30%, #ff4444, #cc0000);
            color: rgba(255, 68, 68, 0.8);
        }

        #bombButton {
            background: radial-gradient(circle at 30% 30%, #ffaa00, #ff6600);
            color: rgba(255, 170, 0, 0.8);
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 500;
        }

        .hud-element {
            position: absolute;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(0, 212, 255, 0.6);
            border-radius: 10px;
            padding: 15px;
            backdrop-filter: blur(10px);
        }

        #radar {
            top: 20px;
            left: 20px;
            width: 180px;
            height: 180px;
        }

        #stats {
            top: 20px;
            right: 20px;
            width: 200px;
            height: 120px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stat-bar {
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .stat-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .health-fill { background: linear-gradient(90deg, #ff4444, #ffaa00); }
        .ammo-fill { background: linear-gradient(90deg, #00d4ff, #0099cc); }
        .fuel-fill { background: linear-gradient(90deg, #00ff9d, #00cc66); }

        .stat-label {
            position: absolute;
            top: 50%;
            left: 10px;
            transform: translateY(-50%);
            color: white;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            pointer-events: none;
            z-index: 400;
        }

        .crosshair-line {
            position: absolute;
            background: #ff4444;
            box-shadow: 0 0 10px #ff4444;
        }

        .crosshair-h {
            width: 100%;
            height: 2px;
            top: 50%;
            transform: translateY(-50%);
        }

        .crosshair-v {
            width: 2px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Minimap */
        #minimap {
            position: absolute;
            bottom: 200px;
            right: 20px;
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(0, 212, 255, 0.6);
            border-radius: 10px;
            overflow: hidden;
        }

        /* Loading Screen */
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            color: white;
        }

        .loading-bar {
            width: 300px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 20px;
            overflow: hidden;
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #0099cc);
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <!-- HUD -->
        <div id="hud">
            <div class="hud-element" id="radar">
                <!-- رادار با WebGL رسم خواهد شد -->
            </div>
            
            <div class="hud-element" id="stats">
                <div class="stat-bar">
                    <div class="stat-fill health-fill" style="width: 100%"></div>
                    <div class="stat-label">سلامت: 100%</div>
                </div>
                <div class="stat-bar">
                    <div class="stat-fill ammo-fill" style="width: 100%"></div>
                    <div class="stat-label">سلاح: 100%</div>
                </div>
                <div class="stat-bar">
                    <div class="stat-fill fuel-fill" style="width: 100%"></div>
                    <div class="stat-label">سوخت: 100%</div>
                </div>
            </div>
        </div>

        <div id="crosshair">
            <div class="crosshair-line crosshair-h"></div>
            <div class="crosshair-line crosshair-v"></div>
        </div>

        <div id="minimap"></div>

        <!-- کنترل‌ها -->
        <div id="controls">
            <div class="control-group">
                <div class="joystick-container">
                    <div class="joystick-base"></div>
                    <div class="joystick-handle"></div>
                </div>
            </div>
            
            <div class="control-group">
                <div class="action-button" id="bombButton">بمب</div>
                <div class="action-button" id="fireButton">شلیک</div>
            </div>
        </div>

        <!-- Loading Screen -->
        <div id="loadingScreen">
            <h1 style="color: #00d4ff; margin-bottom: 20px; font-size: 2.5em;">عملیات پهپادی</h1>
            <p style="margin-bottom: 10px; font-size: 1.2em;">در حال بارگذاری موتور گرافیکی...</p>
            <div class="loading-bar">
                <div class="loading-progress" id="loadingProgress"></div>
            </div>
        </div>
    </div>

    <script>
        // سیستم مدیریت منابع و رندرینگ پیشرفته
        class AdvancedGameEngine {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.gl = this.canvas.getContext('webgl2', {
                    alpha: false,
                    antialias: true,
                    depth: true,
                    stencil: true,
                    powerPreference: 'high-performance'
                });

                if (!this.gl) {
                    alert('مرورگر شما از WebGL 2 پشتیبانی نمی‌کند!');
                    return;
                }

                this.setupEngine();
                this.init();
            }

            setupEngine() {
                // تنظیمات پیشرفته WebGL
                this.gl.enable(this.gl.DEPTH_TEST);
                this.gl.enable(this.gl.BLEND);
                this.gl.blendFunc(this.gl.SRC_ALPHA, this.gl.ONE_MINUS_SRC_ALPHA);
                this.gl.enable(this.gl.CULL_FACE);
                this.gl.cullFace(this.gl.BACK);
                
                // تنظیمات آنتی‌آلیاسینگ
                this.gl.getExtension('EXT_color_buffer_float');
                this.gl.getExtension('OES_texture_float_linear');
                
                // سیستم مدیریت بافرها
                this.buffers = new Map();
                this.textures = new Map();
                this.shaders = new Map();
                this.meshes = new Map();
                
                // سیستم ذرات
                this.particleSystems = [];
                this.lightSystems = [];
                
                // سیستم فیزیک
                this.physicsWorld = this.createPhysicsWorld();
            }

            createPhysicsWorld() {
                // شبیه‌سازی سیستم فیزیک پیشرفته
                return {
                    gravity: { x: 0, y: -9.81, z: 0 },
                    objects: new Map(),
                    collisions: new Set(),
                    
                    addObject: function(obj) {
                        this.objects.set(obj.id, obj);
                    },
                    
                    update: function(deltaTime) {
                        // به روزرسانی موقعیت‌ها بر اساس فیزیک
                        this.objects.forEach(obj => {
                            if (obj.velocity) {
                                obj.x += obj.velocity.x * deltaTime;
                                obj.y += obj.velocity.y * deltaTime;
                                obj.z += obj.velocity.z * deltaTime;
                                
                                // اعمال گرانش
                                obj.velocity.y += this.gravity.y * deltaTime;
                            }
                        });
                        
                        // تشخیص برخورد
                        this.detectCollisions();
                    },
                    
                    detectCollisions: function() {
                        this.collisions.clear();
                        const objects = Array.from(this.objects.values());
                        
                        for (let i = 0; i < objects.length; i++) {
                            for (let j = i + 1; j < objects.length; j++) {
                                if (this.checkCollision(objects[i], objects[j])) {
                                    this.collisions.add([objects[i], objects[j]]);
                                }
                            }
                        }
                    },
                    
                    checkCollision: function(obj1, obj2) {
                        const dx = obj1.x - obj2.x;
                        const dy = obj1.y - obj2.y;
                        const dz = obj1.z - obj2.z;
                        const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);
                        return distance < (obj1.radius + obj2.radius);
                    }
                };
            }

            async init() {
                await this.loadAssets();
                this.setupScene();
                this.setupControls();
                this.startGameLoop();
            }

            async loadAssets() {
                const loadingProgress = document.getElementById('loadingProgress');
                const totalSteps = 10;
                
                for (let i = 0; i <= totalSteps; i++) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    loadingProgress.style.width = `${(i / totalSteps) * 100}%`;
                    
                    switch(i) {
                        case 1:
                            await this.compileShaders();
                            break;
                        case 2:
                            await this.createGeometry();
                            break;
                        case 3:
                            await this.loadTextures();
                            break;
                        case 4:
                            await this.setupLighting();
                            break;
                        case 5:
                            await this.createParticleSystems();
                            break;
                        case 6:
                            await this.generateCity();
                            break;
                        case 7:
                            await this.setupPostProcessing();
                            break;
                        case 8:
                            await this.initAudio();
                            break;
                        case 9:
                            await this.finalizeSetup();
                            break;
                    }
                }
                
                // مخفی کردن صفحه لودینگ
                setTimeout(() => {
                    document.getElementById('loadingScreen').style.display = 'none';
                }, 500);
            }

            async compileShaders() {
                // کامپایل شیدرهای پیشرفته
                const vertexShaderSource = `#version 300 es
                    in vec3 aPosition;
                    in vec2 aTexCoord;
                    in vec3 aNormal;
                    
                    uniform mat4 uModelMatrix;
                    uniform mat4 uViewMatrix;
                    uniform mat4 uProjectionMatrix;
                    uniform vec3 uLightPosition;
                    
                    out vec2 vTexCoord;
                    out vec3 vNormal;
                    out vec3 vLightDirection;
                    
                    void main() {
                        gl_Position = uProjectionMatrix * uViewMatrix * uModelMatrix * vec4(aPosition, 1.0);
                        vTexCoord = aTexCoord;
                        vNormal = mat3(uModelMatrix) * aNormal;
                        vLightDirection = normalize(uLightPosition - aPosition);
                    }
                `;

                const fragmentShaderSource = `#version 300 es
                    precision highp float;
                    
                    in vec2 vTexCoord;
                    in vec3 vNormal;
                    in vec3 vLightDirection;
                    
                    uniform sampler2D uTexture;
                    uniform vec3 uLightColor;
                    uniform float uTime;
                    
                    out vec4 fragColor;
                    
                    void main() {
                        vec4 textureColor = texture(uTexture, vTexCoord);
                        float ambient = 0.3;
                        float diffuse = max(dot(normalize(vNormal), vLightDirection), 0.0);
                        vec3 light = uLightColor * (ambient + diffuse);
                        
                        // افکت پالس نوری
                        float pulse = sin(uTime * 2.0) * 0.1 + 0.9;
                        light *= pulse;
                        
                        fragColor = vec4(textureColor.rgb * light, textureColor.a);
                    }
                `;

                this.shaders.set('main', this.createShaderProgram(vertexShaderSource, fragmentShaderSource));
            }

            createShaderProgram(vertexSource, fragmentSource) {
                const vertexShader = this.gl.createShader(this.gl.VERTEX_SHADER);
                this.gl.shaderSource(vertexShader, vertexSource);
                this.gl.compileShader(vertexShader);

                const fragmentShader = this.gl.createShader(this.gl.FRAGMENT_SHADER);
                this.gl.shaderSource(fragmentShader, fragmentSource);
                this.gl.compileShader(fragmentShader);

                const program = this.gl.createProgram();
                this.gl.attachShader(program, vertexShader);
                this.gl.attachShader(program, fragmentShader);
                this.gl.linkProgram(program);

                return program;
            }

            async createGeometry() {
                // ایجاد هندسه‌های پیشرفته
                this.createDroneMesh();
                this.createBuildingMesh();
                this.createVehicleMesh();
                this.createProjectileMesh();
            }

            createDroneMesh() {
                // ایجاد مش پهپاد با جزئیات بالا
                const vertices = new Float32Array([
                    // بدنه اصلی، بازوها، ملخ‌ها
                    // (مقادیر مختصات سه بعدی)
                ]);

                const indices = new Uint16Array([
                    // ایندکس‌های مثلث‌ها
                ]);

                this.meshes.set('drone', this.createBuffer(vertices, indices));
            }

            createBuffer(vertices, indices) {
                const vao = this.gl.createVertexArray();
                this.gl.bindVertexArray(vao);

                const vertexBuffer = this.gl.createBuffer();
                this.gl.bindBuffer(this.gl.ARRAY_BUFFER, vertexBuffer);
                this.gl.bufferData(this.gl.ARRAY_BUFFER, vertices, this.gl.STATIC_DRAW);

                const indexBuffer = this.gl.createBuffer();
                this.gl.bindBuffer(this.gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
                this.gl.bufferData(this.gl.ELEMENT_ARRAY_BUFFER, indices, this.gl.STATIC_DRAW);

                return { vao, vertexCount: indices.length };
            }

            setupScene() {
                // تنظیم صحنه اصلی بازی
                this.camera = {
                    position: { x: 0, y: 100, z: 200 },
                    target: { x: 0, y: 0, z: 0 },
                    fov: 60 * Math.PI / 180,
                    near: 0.1,
                    far: 5000
                };

                this.drone = {
                    position: { x: 0, y: 50, z: 0 },
                    rotation: { x: 0, y: 0, z: 0 },
                    velocity: { x: 0, y: 0, z: 0 },
                    health: 100,
                    ammo: 100,
                    fuel: 100
                };

                this.world = {
                    buildings: [],
                    vehicles: [],
                    projectiles: [],
                    explosions: []
                };

                // تولید شهر
                this.generateProceduralCity();
            }

            generateProceduralCity() {
                // تولید procedural شهر با ساختمان‌های متنوع
                for (let x = -500; x <= 500; x += 100) {
                    for (let z = -500; z <= 500; z += 100) {
                        if (Math.random() > 0.3) {
                            this.world.buildings.push({
                                position: { x, y: 0, z },
                                scale: { 
                                    x: 20 + Math.random() * 30, 
                                    y: 50 + Math.random() * 100, 
                                    z: 20 + Math.random() * 30 
                                },
                                type: Math.floor(Math.random() * 3),
                                health: 100
                            });
                        }
                    }
                }

                // تولید وسایل نقلیه
                for (let i = 0; i < 50; i++) {
                    this.world.vehicles.push({
                        position: { 
                            x: Math.random() * 1000 - 500, 
                            y: 0, 
                            z: Math.random() * 1000 - 500 
                        },
                        velocity: {
                            x: (Math.random() - 0.5) * 2,
                            y: 0,
                            z: (Math.random() - 0.5) * 2
                        },
                        type: Math.floor(Math.random() * 4),
                        health: 100
                    });
                }
            }

            setupControls() {
                const joystickHandle = document.querySelector('.joystick-handle');
                const fireButton = document.getElementById('fireButton');
                const bombButton = document.getElementById('bombButton');
                const joystickBase = document.querySelector('.joystick-base');
                
                let touchId = null;
                let baseRect = joystickBase.getBoundingClientRect();
                const maxDistance = 50;

                // کنترل جویستیک
                joystickHandle.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    touchId = e.changedTouches[0].identifier;
                    this.input.active = true;
                });

                document.addEventListener('touchmove', (e) => {
                    if (!touchId) return;
                    
                    for (let touch of e.changedTouches) {
                        if (touch.identifier === touchId) {
                            e.preventDefault();
                            
                            const touchX = touch.clientX - baseRect.left - baseRect.width / 2;
                            const touchY = touch.clientY - baseRect.top - baseRect.height / 2;
                            
                            const distance = Math.sqrt(touchX * touchX + touchY * touchY);
                            const angle = Math.atan2(touchY, touchX);
                            
                            if (distance > maxDistance) {
                                this.input.x = Math.cos(angle);
                                this.input.y = Math.sin(angle);
                                joystickHandle.style.transform = `translate(calc(-50% + ${Math.cos(angle) * maxDistance}px), calc(-50% + ${Math.sin(angle) * maxDistance}px))`;
                            } else {
                                this.input.x = touchX / maxDistance;
                                this.input.y = touchY / maxDistance;
                                joystickHandle.style.transform = `translate(calc(-50% + ${touchX}px), calc(-50% + ${touchY}px))`;
                            }
                            
                            break;
                        }
                    }
                });

                document.addEventListener('touchend', (e) => {
                    for (let touch of e.changedTouches) {
                        if (touch.identifier === touchId) {
                            e.preventDefault();
                            this.input.x = 0;
                            this.input.y = 0;
                            this.input.active = false;
                            joystickHandle.style.transform = 'translate(-50%, -50%)';
                            touchId = null;
                            break;
                        }
                    }
                });

                // کنترل‌های شلیک
                fireButton.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.input.fire = true;
                    this.fireWeapon();
                });

                fireButton.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.input.fire = false;
                });

                bombButton.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.input.bomb = true;
                    this.dropBomb();
                });

                bombButton.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.input.bomb = false;
                });

                // کنترل کیبورد برای تست
                document.addEventListener('keydown', (e) => {
                    switch(e.code) {
                        case 'KeyW': this.input.y = 1; break;
                        case 'KeyS': this.input.y = -1; break;
                        case 'KeyA': this.input.x = -1; break;
                        case 'KeyD': this.input.x = 1; break;
                        case 'Space': this.input.fire = true; break;
                    }
                });

                document.addEventListener('keyup', (e) => {
                    switch(e.code) {
                        case 'KeyW': case 'KeyS': this.input.y = 0; break;
                        case 'KeyA': case 'KeyD': this.input.x = 0; break;
                        case 'Space': this.input.fire = false; break;
                    }
                });

                this.input = {
                    x: 0,
                    y: 0,
                    fire: false,
                    bomb: false,
                    active: false
                };
            }

            fireWeapon() {
                if (this.drone.ammo > 0) {
                    this.world.projectiles.push({
                        position: { ...this.drone.position },
                        velocity: { x: 0, y: 0, z: -50 },
                        type: 'bullet',
                        damage: 10,
                        lifetime: 3.0
                    });
                    this.drone.ammo--;
                    this.updateHUD();
                }
            }

            dropBomb() {
                this.world.projectiles.push({
                    position: { ...this.drone.position },
                    velocity: { x: 0, y: -10, z: 0 },
                    type: 'bomb',
                    damage: 50,
                    lifetime: 5.0
                });
            }

            updateHUD() {
                // به روزرسانی HUD
                document.querySelector('.health-fill').style.width = `${this.drone.health}%`;
                document.querySelector('.ammo-fill').style.width = `${this.drone.ammo}%`;
                document.querySelector('.fuel-fill').style.width = `${this.drone.fuel}%`;
                
                document.querySelector('.stat-label').textContent = `سلامت: ${Math.round(this.drone.health)}%`;
            }

            startGameLoop() {
                let lastTime = 0;
                
                const gameLoop = (currentTime) => {
                    const deltaTime = Math.min((currentTime - lastTime) / 1000, 0.1);
                    lastTime = currentTime;
                    
                    this.update(deltaTime);
                    this.render();
                    
                    requestAnimationFrame(gameLoop);
                };
                
                requestAnimationFrame(gameLoop);
            }

            update(deltaTime) {
                // به روزرسانی موقعیت پهپاد
                if (this.input.active) {
                    this.drone.velocity.x = this.input.x * 20;
                    this.drone.velocity.z = this.input.y * 20;
                } else {
                    this.drone.velocity.x *= 0.9;
                    this.drone.velocity.z *= 0.9;
                }
                
                this.drone.position.x += this.drone.velocity.x * deltaTime;
                this.drone.position.z += this.drone.velocity.z * deltaTime;
                
                // محدودیت‌های حرکت
                this.drone.position.x = Math.max(-480, Math.min(480, this.drone.position.x));
                this.drone.position.z = Math.max(-480, Math.min(480, this.drone.position.z));
                
                // به روزرسانی دوربین
                this.camera.position.x = this.drone.position.x;
                this.camera.position.z = this.drone.position.z + 50;
                this.camera.target.x = this.drone.position.x;
                this.camera.target.z = this.drone.position.z - 50;
                
                // به روزرسانی فیزیک
                this.physicsWorld.update(deltaTime);
                
                // به روزرسانی پرتابه‌ها
                this.updateProjectiles(deltaTime);
                
                // به روزرسانی وسایل نقلیه
                this.updateVehicles(deltaTime);
                
                // کاهش سوخت
                this.drone.fuel = Math.max(0, this.drone.fuel - deltaTime * 0.1);
                if (this.drone.fuel <= 0) {
                    // بازی تمام شد
                }
            }

            updateProjectiles(deltaTime) {
                for (let i = this.world.projectiles.length - 1; i >= 0; i--) {
                    const projectile = this.world.projectiles[i];
                    
                    // حرکت پرتابه
                    projectile.position.x += projectile.velocity.x * deltaTime;
                    projectile.position.y += projectile.velocity.y * deltaTime;
                    projectile.position.z += projectile.velocity.z * deltaTime;
                    
                    // کاهش طول عمر
                    projectile.lifetime -= deltaTime;
                    
                    // بررسی برخورد
                    if (this.checkProjectileCollision(projectile) || projectile.lifetime <= 0) {
                        if (projectile.type === 'bomb') {
                            this.createExplosion(projectile.position);
                        }
                        this.world.projectiles.splice(i, 1);
                    }
                }
            }

            updateVehicles(deltaTime) {
                this.world.vehicles.forEach(vehicle => {
                    if (vehicle.health > 0) {
                        // حرکت وسایل نقلیه
                        vehicle.position.x += vehicle.velocity.x * deltaTime;
                        vehicle.position.z += vehicle.velocity.z * deltaTime;
                        
                        // بازگشت به محدوده
                        if (vehicle.position.x < -500 || vehicle.position.x > 500) {
                            vehicle.velocity.x *= -1;
                        }
                        if (vehicle.position.z < -500 || vehicle.position.z > 500) {
                            vehicle.velocity.z *= -1;
                        }
                    }
                });
            }

            checkProjectileCollision(projectile) {
                // بررسی برخورد با ساختمان‌ها
                for (let building of this.world.buildings) {
                    if (building.health > 0) {
                        const dx = projectile.position.x - building.position.x;
                        const dz = projectile.position.z - building.position.z;
                        const distance = Math.sqrt(dx * dx + dz * dz);
                        
                        if (distance < 30) {
                            building.health -= projectile.damage;
                            return true;
                        }
                    }
                }
                
                // بررسی برخورد با وسایل نقلیه
                for (let vehicle of this.world.vehicles) {
                    if (vehicle.health > 0) {
                        const dx = projectile.position.x - vehicle.position.x;
                        const dz = projectile.position.z - vehicle.position.z;
                        const distance = Math.sqrt(dx * dx + dz * dz);
                        
                        if (distance < 15) {
                            vehicle.health -= projectile.damage;
                            if (vehicle.health <= 0) {
                                this.createExplosion(vehicle.position);
                            }
                            return true;
                        }
                    }
                }
                
                return false;
            }

            createExplosion(position) {
                this.world.explosions.push({
                    position: { ...position },
                    scale: 1.0,
                    lifetime: 1.0
                });
                
                // ایجاد سیستم ذرات برای انفجار
                this.createExplosionParticles(position);
            }

            createExplosionParticles(position) {
                // ایجاد ذرات انفجار
                for (let i = 0; i < 50; i++) {
                    this.particleSystems.push({
                        position: { ...position },
                        velocity: {
                            x: (Math.random() - 0.5) * 20,
                            y: Math.random() * 15,
                            z: (Math.random() - 0.5) * 20
                        },
                        lifetime: 1.0 + Math.random() * 0.5,
                        size: 2 + Math.random() * 4
                    });
                }
            }

            render() {
                // پاک کردن بافرها
                this.gl.clearColor(0.1, 0.1, 0.2, 1.0);
                this.gl.clear(this.gl.COLOR_BUFFER_BIT | this.gl.DEPTH_BUFFER_BIT);
                
                // تنظیم ماتریس‌های دید
                this.setupCamera();
                
                // رسم اشیاء
                this.renderBuildings();
                this.renderVehicles();
                this.renderDrone();
                this.renderProjectiles();
                this.renderExplosions();
                this.renderParticles();
                
                // post-processing effects
                this.applyPostProcessing();
            }

            setupCamera() {
                // محاسبه ماتریس‌های projection و view
                const aspect = this.canvas.width / this.canvas.height;
                const projectionMatrix = this.perspectiveMatrix(
                    this.camera.fov, aspect, this.camera.near, this.camera.far
                );
                
                const viewMatrix = this.lookAtMatrix(
                    this.camera.position,
                    this.camera.target,
                    { x: 0, y: 1, z: 0 }
                );
                
                // ارسال به شیدر
                this.gl.useProgram(this.shaders.get('main'));
                // ... ارسال ماتریس‌ها به uniformها
            }

            perspectiveMatrix(fov, aspect, near, far) {
                // ایجاد ماتریس projection
                const f = 1.0 / Math.tan(fov / 2);
                return [
                    f / aspect, 0, 0, 0,
                    0, f, 0, 0,
                    0, 0, (far + near) / (near - far), -1,
                    0, 0, (2 * far * near) / (near - far), 0
                ];
            }

            lookAtMatrix(eye, target, up) {
                // ایجاد ماتریس view
                const z = this.normalize(this.subtract(eye, target));
                const x = this.normalize(this.cross(up, z));
                const y = this.normalize(this.cross(z, x));
                
                return [
                    x.x, x.y, x.z, -this.dot(x, eye),
                    y.x, y.y, y.z, -this.dot(y, eye),
                    z.x, z.y, z.z, -this.dot(z, eye),
                    0, 0, 0, 1
                ];
            }

            // توابع ریاضی برای ماتریس‌ها
            normalize(v) {
                const length = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z);
                return {
                    x: v.x / length,
                    y: v.y / length,
                    z: v.z / length
                };
            }

            subtract(a, b) {
                return {
                    x: a.x - b.x,
                    y: a.y - b.y,
                    z: a.z - b.z
                };
            }

            cross(a, b) {
                return {
                    x: a.y * b.z - a.z * b.y,
                    y: a.z * b.x - a.x * b.z,
                    z: a.x * b.y - a.y * b.x
                };
            }

            dot(a, b) {
                return a.x * b.x + a.y * b.y + a.z * b.z;
            }

            renderDrone() {
                // رسم پهپاد با جزئیات بالا
                this.gl.useProgram(this.shaders.get('main'));
                this.gl.bindVertexArray(this.meshes.get('drone').vao);
                
                // تنظیم موقعیت و چرخش
                const modelMatrix = this.createModelMatrix(
                    this.drone.position,
                    this.drone.rotation,
                    { x: 1, y: 1, z: 1 }
                );
                
                // رسم
                this.gl.drawElements(this.gl.TRIANGLES, this.meshes.get('drone').vertexCount, this.gl.UNSIGNED_SHORT, 0);
            }

            createModelMatrix(position, rotation, scale) {
                // ایجاد ماتریس مدل
                // (پیاده‌سازی کامل ماتریس تبدیل)
                return [
                    scale.x, 0, 0, position.x,
                    0, scale.y, 0, position.y,
                    0, 0, scale.z, position.z,
                    0, 0, 0, 1
                ];
            }

            renderBuildings() {
                // رسم ساختمان‌های شهر
                this.world.buildings.forEach(building => {
                    if (building.health > 0) {
                        // رسم هر ساختمان
                    }
                });
            }

            renderVehicles() {
                // رسم وسایل نقلیه
                this.world.vehicles.forEach(vehicle => {
                    if (vehicle.health > 0) {
                        // رسم هر وسیله نقلیه
                    }
                });
            }

            renderProjectiles() {
                // رسم پرتابه‌ها
                this.world.projectiles.forEach(projectile => {
                    // رسم هر پرتابه
                });
            }

            renderExplosions() {
                // رسم انفجارها
                this.world.explosions.forEach((explosion, index) => {
                    explosion.lifetime -= 0.016;
                    explosion.scale += 0.5;
                    
                    if (explosion.lifetime <= 0) {
                        this.world.explosions.splice(index, 1);
                    } else {
                        // رسم انفجار
                    }
                });
            }

            renderParticles() {
                // رسم سیستم‌های ذرات
                this.particleSystems.forEach((particle, index) => {
                    particle.lifetime -= 0.016;
                    particle.position.x += particle.velocity.x * 0.016;
                    particle.position.y += particle.velocity.y * 0.016;
                    particle.position.z += particle.velocity.z * 0.016;
                    
                    if (particle.lifetime <= 0) {
                        this.particleSystems.splice(index, 1);
                    } else {
                        // رسم ذره
                    }
                });
            }

            applyPostProcessing() {
                // اعمال افکت‌های post-processing
                // Bloom, Motion Blur, Color Grading, etc.
            }
        }

        // راه‌اندازی بازی
        window.addEventListener('load', () => {
            const game = new AdvancedGameEngine();
        });

        // مدیریت رزولوشن و ریسایز
        window.addEventListener('resize', () => {
            const gameContainer = document.getElementById('gameContainer');
            const canvas = document.getElementById('gameCanvas');
            
            canvas.width = gameContainer.clientWidth * window.devicePixelRatio;
            canvas.height = gameContainer.clientHeight * window.devicePixelRatio;
            canvas.style.width = gameContainer.clientWidth + 'px';
            canvas.style.height = gameContainer.clientHeight + 'px';
        });
    </script>
